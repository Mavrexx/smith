name: Smith
options:
  bundleIdPrefix: com.farhan.smith
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2.3.0
    DEVELOPMENT_TEAM: ""
targets:
  Smith:
    type: application
    platform: iOS
    sources:
      - SmithApp
      - Shared
    info:
      path: SmithApp/Info.plist
    entitlements:
      path: SmithApp/Smith.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith
        PRODUCT_NAME: Smith
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: SmithWidgets
        embed: true
      - target: SmithShare
        embed: true
      - target: SmithNotificationService
        embed: true
  SmithWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SmithWidgets
      - Shared
    info:
      path: SmithWidgets/Info.plist
    entitlements:
      path: SmithWidgets/SmithWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.widgets
        SKIP_INSTALL: YES
  SmithShare:
    type: app-extension
    platform: iOS
    sources:
      - SmithShare
      - Shared/SmithRoutes.swift
    info:
      path: SmithShare/Info.plist
    entitlements:
      path: SmithShare/SmithShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.share
        SKIP_INSTALL: YES
  SmithNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - SmithNotificationService
    info:
      path: SmithNotificationService/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.notification-service
        SKIP_INSTALL: YES
  SmithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmithTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.tests
    dependencies:
      - target: Smith
