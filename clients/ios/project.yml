name: Smith
options:
  bundleIdPrefix: com.farhan.smith
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 2026081402
    MARKETING_VERSION: 2.3.3
    DEVELOPMENT_TEAM: ""
targets:
  Smith:
    type: application
    platform: iOS
    sources:
      - path: SmithApp
        excludes:
          - Info.plist
          - SmithLite-Info.plist
      - Shared
    entitlements:
      path: SmithApp/Smith.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith
        PRODUCT_NAME: Smith
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SmithApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SmithWidgets
        embed: true
      - target: SmithShare
        embed: true
      - target: SmithNotificationService
        embed: true
      - target: SmithBroadcast
        embed: true
  SmithLite:
    type: application
    platform: iOS
    sources:
      - path: SmithApp
        excludes:
          - Info.plist
      - Shared
    info:
      path: SmithApp/SmithLite-Info.plist
      properties:
        CFBundleDisplayName: Smith
        CFBundleURLTypes:
          - CFBundleURLName: com.farhan.smith
            CFBundleURLSchemes:
              - smith
        LSApplicationQueriesSchemes:
          - smith
        NSMicrophoneUsageDescription: Smith uses the microphone only after you tap the orb to start a voice session.
        NSSpeechRecognitionUsageDescription: Speech is sent securely to your private Smith Core for processing.
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.lite
        PRODUCT_NAME: Smith
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SMITH_LITE
  SmithWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SmithWidgets
        excludes:
          - Info.plist
      - Shared
    entitlements:
      path: SmithWidgets/SmithWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.widgets
        INFOPLIST_FILE: SmithWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  SmithShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SmithShare
        excludes:
          - Info.plist
      - Shared/SmithRoutes.swift
    entitlements:
      path: SmithShare/SmithShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.share
        INFOPLIST_FILE: SmithShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  SmithNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: SmithNotificationService
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.notification-service
        INFOPLIST_FILE: SmithNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  SmithBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SmithBroadcast
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.broadcast
        PRODUCT_NAME: SmithBroadcast
        INFOPLIST_FILE: SmithBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  SmithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmithTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.smith.tests
    dependencies:
      - target: Smith
